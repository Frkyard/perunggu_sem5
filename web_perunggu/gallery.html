<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PERUNGGU — Galeri foto perjalanan band PERUNGGU dari berbagai konser dan momen berkesan.">
    <meta name="theme-color" content="#0a0a0f">
    <title>PERUNGGU — Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<!-- HEADER -->
<header id="main-header">
    <div class="logo">
        <img src="images/logo.jpeg" alt="Logo Perunggu">
        <span>PERUNGGU</span>
    </div>
    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
    </button>
    <nav id="main-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="music.html">Music</a></li>
            <li><a href="updates.html">Updates</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<!-- GALLERY SECTION -->
<section class="page-section" id="gallery-section">
    <div class="gallery-header">
        <h2 class="section-title">Gallery</h2>
        <p style="color: var(--text-secondary); font-size: 16px; margin-top: -10px;">Perjalanan kami dalam gambar — dari panggung hingga di balik layar</p>
    </div>

    <div id="gallery-content" aria-live="polite">Memuat galeri...</div>

</section>

<!-- LIGHTBOX MODAL -->
<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">
        <i class="fas fa-times"></i>
    </button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous">
        <i class="fas fa-chevron-left"></i>
    </button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next">
        <i class="fas fa-chevron-right"></i>
    </button>
    <div class="lightbox-box">
        <img src="" alt="Gallery Image" id="lightbox-img">
        <div class="lightbox-caption-text" id="lightbox-caption"></div>
    </div>
</div>

<!-- FOOTER -->
<footer id="main-footer">
    <div class="footer-left">
        <img src="images/logo.jpeg" alt="Perunggu Logo">
        <div class="social">
            <a href="https://www.instagram.com/perunggu_/" target="_blank" aria-label="Instagram" id="social-instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.youtube.com/channel/UCTkiKmLQPAC_pR9Nbnc-4IA" target="_blank" aria-label="YouTube" id="social-youtube">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="https://open.spotify.com/intl-id/artist/0NbKRRBuiIUwS9irPvi7wD" target="_blank" aria-label="Spotify" id="social-spotify">
                <i class="fa-brands fa-spotify"></i>
            </a>
            <a href="https://www.tiktok.com/@perunggu__" target="_blank" aria-label="TikTok" id="social-tiktok">
                <i class="fa-brands fa-tiktok"></i>
            </a>
        </div>
    </div>
    <p>&copy; Copyright 2026 PERUNGGU</p>
</footer>

<script>
    // Hamburger menu toggle
    const menuToggle = document.getElementById('menu-toggle');
    const mainNav = document.getElementById('main-nav');

    menuToggle.addEventListener('click', () => {
        menuToggle.classList.toggle('active');
        mainNav.classList.toggle('open');
    });

    mainNav.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            menuToggle.classList.remove('active');
            mainNav.classList.remove('open');
        });
    });

    // Lightbox functionality
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const lightboxClose = document.getElementById('lightbox-close');
    const lightboxPrev = document.getElementById('lightbox-prev');
    const lightboxNext = document.getElementById('lightbox-next');
    let currentImageIndex = 0;

    // Close lightbox
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
            closeLightbox();
        }
    });

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
    }

    // Show image
    function showImage(index) {
        const galleryItems = document.querySelectorAll('.gallery-item');
        const item = galleryItems[index];
        if (!item) return;

        const img = item.querySelector('img');
        const title = item.querySelector('.gallery-caption h4')?.textContent || img.alt || '';
        const desc = item.querySelector('.gallery-caption p')?.textContent || '';

        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        if (lightboxCaption) {
            lightboxCaption.replaceChildren();
            const heading = document.createElement('h4');
            heading.textContent = title;
            lightboxCaption.appendChild(heading);
            if (desc) {
                const paragraph = document.createElement('p');
                paragraph.textContent = desc;
                lightboxCaption.appendChild(paragraph);
            }
        }
    }

    // Navigate images
    lightboxNext.addEventListener('click', (e) => {
        e.stopPropagation();
        const galleryItems = document.querySelectorAll('.gallery-item');
        if (galleryItems.length === 0) return;
        currentImageIndex = (currentImageIndex + 1) % galleryItems.length;
        showImage(currentImageIndex);
    });

    lightboxPrev.addEventListener('click', (e) => {
        e.stopPropagation();
        const galleryItems = document.querySelectorAll('.gallery-item');
        if (galleryItems.length === 0) return;
        currentImageIndex = (currentImageIndex - 1 + galleryItems.length) % galleryItems.length;
        showImage(currentImageIndex);
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;

        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') lightboxNext.click();
        if (e.key === 'ArrowLeft') lightboxPrev.click();
    });

    async function loadGallery() {
        const galleryContent = document.getElementById('gallery-content');
        try {
            const response = await fetch('api/gallery.php', { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`Server mengembalikan status ${response.status}.`);
            }

            const result = await response.json();
            if (result.status !== 'success' || !Array.isArray(result.data)) {
                throw new Error('Respons data galeri tidak valid.');
            }

            if (result.data.length === 0) {
                galleryContent.textContent = 'Belum ada foto galeri.';
                return;
            }

            const categories = new Map();
            result.data.forEach(photo => {
                const category = String(photo.category || 'Lainnya');
                if (!categories.has(category)) categories.set(category, []);
                categories.get(category).push(photo);
            });

            galleryContent.replaceChildren();
            categories.forEach((photos, category) => {
                const section = document.createElement('div');
                section.className = 'gallery-category';

                const heading = document.createElement('h3');
                heading.textContent = category;
                heading.style.cssText = "font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 20px; letter-spacing: 1px;";

                const grid = document.createElement('div');
                grid.className = 'gallery-grid';
                photos.forEach(photo => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';

                    const image = document.createElement('img');
                    image.src = String(photo.image_url || '');
                    image.alt = String(photo.title || 'Foto galeri PERUNGGU');

                    const overlay = document.createElement('div');
                    overlay.className = 'gallery-overlay';
                    const caption = document.createElement('div');
                    caption.className = 'gallery-caption';
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-search-plus';
                    const title = document.createElement('h4');
                    title.textContent = String(photo.title || '');
                    caption.append(icon, title);

                    if (photo.caption) {
                        const description = document.createElement('p');
                        description.textContent = String(photo.caption);
                        caption.appendChild(description);
                    }

                    overlay.appendChild(caption);
                    item.append(image, overlay);
                    item.addEventListener('click', () => {
                        currentImageIndex = Array.from(document.querySelectorAll('.gallery-item')).indexOf(item);
                        showImage(currentImageIndex);
                        lightbox.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    });
                    grid.appendChild(item);
                });

                section.append(heading, grid);
                galleryContent.appendChild(section);
            });
        } catch (error) {
            console.error('Galeri gagal dimuat:', error);
            galleryContent.textContent = 'Galeri gagal dimuat. Silakan muat ulang halaman atau hubungi administrator.';
        }
    }

    loadGallery();
</script>

</body>
</html>
